[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "predict_future_sales_eda"
version = "0.0.1"
description = "EDA de Predict Future Sales orientado a forecasting"
authors = [
  { name = "Ingrid Carolina Ortiz Mejicanos" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["predict_future_sales_eda"]
include = ["pyproject.toml", "predict_future_sales_eda/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["predict_future_sales_eda"]
force-sort-within-sections = true

